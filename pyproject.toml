[project]
name = "hiveforge"
version = "2.2.0"
description = "Scaffold KIRO Methodology v05 projects with multi-agent architecture"
authors = [
    {name = "Alex Soshnin", email = "89580632+asoshnin@users.noreply.github.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.11"
keywords = ["kiro", "multi-agent", "scaffolding", "cli", "methodology", "ai", "agents"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Code Generators",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Operating System :: OS Independent",
]
dependencies = [
    "typer (>=0.23.1,<0.24.0)",
    "pypdf (>=5.1.0,<6.0.0)",
    "pytesseract (>=0.3.10,<0.4.0)",
    "Pillow (>=10.0.0,<11.0.0)",
    "colorama (>=0.4.6,<0.5.0)",
    "tree-sitter (>=0.20.0,<0.21.0)",
    "pathspec (>=0.11.0,<0.12.0)",
    "tomli (>=2.0.0,<3.0.0)"
]

[project.urls]
Homepage = "https://github.com/asoshnin/hiveforge"
Documentation = "https://github.com/asoshnin/hiveforge#readme"
Repository = "https://github.com/asoshnin/hiveforge"
Issues = "https://github.com/asoshnin/hiveforge/issues"
Changelog = "https://github.com/asoshnin/hiveforge/blob/main/CHANGELOG.md"

[project.scripts]
hiveforge = "hiveforge.cli:app"



[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "pytest (>=9.0.2,<10.0.0)",
    "pytest-cov (>=7.0.0,<8.0.0)",
    "hypothesis (>=6.90.0,<7.0.0)",
    "reportlab (>=4.0.0,<5.0.0)"
]
