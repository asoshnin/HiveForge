name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  template-sync-check:
    name: Template Sync Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Check template synchronization
        run: |
          python hiveforge-power/scripts/check_template_sync.py
        
      - name: Report results
        if: failure()
        run: |
          echo "::error::Template directories are out of sync!"
          echo "::error::Canonical location: hiveforge-power/hiveforge/templates/steering/"
          echo "::error::Please sync changes from canonical location to src/"

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: template-sync-check
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          cd hiveforge-power
          pip install -e ".[dev]"
      
      - name: Run tests
        run: |
          cd hiveforge-power
          pytest tests/ -v --cov=hiveforge --cov-report=term-missing
