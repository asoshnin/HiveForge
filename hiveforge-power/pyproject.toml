[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiveforge-steering-mcp"
version = "2.0.0"
description = "AI-powered steering file generation and maintenance for KIRO"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "HiveForge Team", email = "team@hiveforge.dev"}
]
keywords = [
    "steering",
    "documentation",
    "onboarding",
    "kiro",
    "mcp",
    "power"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules"
]

dependencies = [
    "fastmcp>=0.1.0",
    "pydantic>=2.0.0",
    "typer>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.7.0",
    "ruff>=0.0.285",
    "mypy>=1.5.0",
]

[project.urls]
Homepage = "https://github.com/yourusername/hiveforge-steering-mcp"
Documentation = "https://docs.hiveforge.dev/steering"
Repository = "https://github.com/yourusername/hiveforge-steering-mcp"
Issues = "https://github.com/yourusername/hiveforge-steering-mcp/issues"

[project.scripts]
hiveforge-steering-mcp = "mcp_server.server:main"

[tool.setuptools]
packages = ["mcp_server", "mcp_server.tools"]

[tool.setuptools.package-dir]
"" = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=mcp_server --cov-report=term-missing"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.ruff]
line-length = 100
target-version = "py311"
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
